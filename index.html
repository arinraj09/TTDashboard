<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRR & SDR Calculator</title>
<style>
  :root {
    --accent: #4f6ef7;
    --border: #e3e6ee;
    --text: #1c2333;
    --muted: #6b7280;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: #fff;
    color: var(--text);
    padding: 16px;
  }

  .card {
    max-width: 480px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 20px;
  }

  .field { margin-bottom: 14px; }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 5px;
  }

  input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fafbfc;
    color: var(--text);
  }

  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 4px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  button:hover { background: #3d5ce5; }

  #error {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    font-size: 0.85rem;
    color: #b91c1c;
    background: #fef2f2;
    border-radius: 8px;
  }

  #results {
    display: none;
    margin-top: 18px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-radius: 8px;
  }

  .row + .row { margin-top: 8px; }
  .row.drr { background: #eef2ff; }
  .row.sdr { background: #ecfdf5; }

  .row .name { font-size: 0.9rem; font-weight: 600; }
  .row .val  { font-size: 1.15rem; font-weight: 700; }
  .drr .val  { color: #4338ca; }
  .sdr .val  { color: #047857; }

  @media (max-width: 380px) {
    body { padding: 10px; }
    h1 { font-size: 1.1rem; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>DRR &amp; SDR Calculator</h1>

    <form id="calcForm">
      <div class="field">
        <label for="drrResolved">DRR Resolved</label>
        <input type="number" id="drrResolved" min="0" inputmode="numeric" required>
      </div>
      <div class="field">
        <label for="sdrResolved">SDR Resolved</label>
        <input type="number" id="sdrResolved" min="0" inputmode="numeric" required>
      </div>
      <div class="field">
        <label for="totalResolved">Total Incidents Resolved / Closed</label>
        <input type="number" id="totalResolved" min="1" inputmode="numeric" required>
      </div>
      <button type="submit">Calculate</button>
    </form>

    <div id="error">Total incidents must be greater than 0.</div>

    <div id="results">
      <div class="row drr">
        <span class="name">DRR %</span>
        <span class="val" id="drrOut">–</span>
      </div>
      <div class="row sdr">
        <span class="name">SDR %</span>
        <span class="val" id="sdrOut">–</span>
      </div>
    </div>
  </div>

<script>
  document.getElementById("calcForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var drr   = parseFloat(document.getElementById("drrResolved").value)  || 0;
    var sdr   = parseFloat(document.getElementById("sdrResolved").value)  || 0;
    var total = parseFloat(document.getElementById("totalResolved").value) || 0;

    var errEl = document.getElementById("error");
    var resEl = document.getElementById("results");

    if (total <= 0) {
      errEl.style.display = "block";
      resEl.style.display = "none";
      return;
    }

    errEl.style.display = "none";
    document.getElementById("drrOut").textContent = ((drr / total) * 100).toFixed(2) + "%";
    document.getElementById("sdrOut").textContent = ((sdr / total) * 100).toFixed(2) + "%";
    resEl.style.display = "block";
  });
</script>
</body>
</html>
